<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Loft</title>
<meta name="description" content="Loft: a classic 3D avatar chat. Make your avatar, dress up from the shop, hang out in rooms with real people.">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<header id="topbar" hidden>
  <a class="logo" href="#/home">Loft</a>
  <nav id="nav">
    <a href="#/home" data-page="home">Home</a><a href="#/rooms" data-page="rooms">Chat Rooms</a><a href="#/shop" data-page="shop">Shop</a><a href="#/dressup" data-page="dressup">Dress Up</a><a href="#/friends" data-page="friends">Friends <span class="badge" id="b-req" hidden></span></a><a href="#/inbox" data-page="inbox">Inbox <span class="badge" id="b-inbox" hidden></span></a><a href="#/pulse" data-page="pulse">Pulse</a>
  </nav>
  <div class="me"><select id="quality" title="Graphics quality"><option value="auto">Auto</option><option value="ultra">Ultra</option><option value="high">High</option><option value="low">Low</option></select><span class="credits" id="credits">0</span><a class="who" href="#/profile/me"><img id="mepic" alt=""><b id="mename"></b></a><button class="small ghost" id="logout">Log out</button></div>
</header>
<main id="page"></main>
<div id="loading"><div class="box"><div class="logo big">Loft</div><div class="bar"><i id="loadbar"></i></div><p id="loadmsg">Loading…</p></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
